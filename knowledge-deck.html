<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 知识翻牌 · 夏日课程</title>
<style>

/* ===== CSS Custom Properties ===== */
:root {
  --bg: #0f0f1a;
  --card-bg: #1a1a2e;
  --card-hover: #1e1e36;
  --card-back: #151528;
  --text: #e0e0e0;
  --text-dim: #8888a0;
  --text-bright: #ffffff;
  --border: #2a2a45;
  --border-active: #4a4a6a;
  --color-people: #f0a500;
  --color-people-bg: rgba(240, 165, 0, 0.12);
  --color-companies: #4a9eff;
  --color-companies-bg: rgba(74, 158, 255, 0.12);
  --color-concepts: #4ade80;
  --color-concepts-bg: rgba(74, 222, 128, 0.12);
  --radius: 16px;
  --radius-sm: 10px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --shadow: 0 4px 24px rgba(0,0,0,0.3);
  --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Container ===== */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 24px 60px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 32px 0 20px;
}

.header h1 {
  font-size: 2rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 6px;
  letter-spacing: -0.02em;
}

.header .subtitle {
  font-size: 0.95rem;
  color: var(--text-dim);
  font-weight: 400;
}

/* ===== Tabs ===== */
.tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 20px 0 24px;
  flex-wrap: wrap;
}

.tab-btn {
  padding: 10px 22px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.95rem;
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 44px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.tab-btn:hover {
  border-color: var(--border-active);
  color: var(--text);
}

.tab-btn.active {
  border-color: var(--color-people);
  color: var(--text-bright);
  background: var(--color-people-bg);
}

.tab-btn[data-tab="companies"].active {
  border-color: var(--color-companies);
  background: var(--color-companies-bg);
}

.tab-btn[data-tab="concepts"].active {
  border-color: var(--color-concepts);
  background: var(--color-concepts-bg);
}

.tab-count {
  font-size: 0.8rem;
  opacity: 0.7;
}

/* ===== Search ===== */
.search-wrap {
  position: relative;
  max-width: 480px;
  margin: 0 auto 20px;
}

.search-wrap input {
  width: 100%;
  padding: 12px 16px 12px 44px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: var(--card-bg);
  color: var(--text);
  font-size: 0.95rem;
  outline: none;
  transition: border var(--transition);
  min-height: 44px;
}

.search-wrap input:focus {
  border-color: var(--border-active);
}

.search-wrap input::placeholder {
  color: var(--text-dim);
  opacity: 0.6;
}

.search-icon {
  position: absolute;
  left: 16px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 1rem;
  pointer-events: none;
}

/* ===== Filter Chips ===== */
.filters {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 28px;
}

.filter-chip {
  padding: 6px 14px;
  border-radius: 100px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all var(--transition);
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  min-height: 36px;
  display: flex;
  align-items: center;
}

.filter-chip:hover {
  border-color: var(--border-active);
  color: var(--text);
}

.filter-chip.active {
  border-color: var(--color-people);
  color: var(--text-bright);
  background: var(--color-people-bg);
}

.tab-companies .filter-chip.active {
  border-color: var(--color-companies);
  background: var(--color-companies-bg);
}

.tab-concepts .filter-chip.active {
  border-color: var(--color-concepts);
  background: var(--color-concepts-bg);
}

/* ===== Stats ===== */
.stats {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 20px;
}

/* ===== Card Grid ===== */
.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
}

@media (max-width: 1024px) {
  .card-grid { grid-template-columns: repeat(3, 1fr); }
}

@media (max-width: 768px) {
  .card-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .header h1 { font-size: 1.6rem; }
  .container { padding: 16px 16px 48px; }
}

@media (max-width: 480px) {
  .card-grid { grid-template-columns: 1fr; gap: 12px; }
  .tabs { gap: 4px; }
  .tab-btn { padding: 8px 14px; font-size: 0.85rem; }
  .filters { gap: 4px; }
  .filter-chip { padding: 5px 10px; font-size: 0.78rem; }
}

/* ===== Flip Card ===== */
.flip-card {
  perspective: 1000px;
  -webkit-perspective: 1000px;
  min-height: 200px;
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 200px;
  transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  cursor: pointer;
}

.flip-card.flipped .flip-card-inner {
  transform: rotateY(180deg);
  -webkit-transform: rotateY(180deg);
}

.flip-card-front,
.flip-card-back {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  min-height: 200px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius);
  padding: 18px 16px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.flip-card-front {
  background: var(--card-bg);
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  transition: box-shadow var(--transition), border-color var(--transition);
}

.flip-card-front:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--border-active);
}

.flip-card-back {
  background: var(--card-back);
  border: 1px solid var(--border);
  transform: rotateY(180deg);
  -webkit-transform: rotateY(180deg);
  box-shadow: var(--shadow-lg);
}

/* Category accent stripe */
.flip-card-front::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: var(--radius) var(--radius) 0 0;
}

.flip-card.cat-people .flip-card-front::before { background: var(--color-people); }
.flip-card.cat-companies .flip-card-front::before { background: var(--color-companies); }
.flip-card.cat-concepts .flip-card-front::before { background: var(--color-concepts); }

/* ===== Card Content - Front ===== */
.card-category {
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-bottom: 6px;
  margin-top: 2px;
}

.cat-people .card-category { color: var(--color-people); }
.cat-companies .card-category { color: var(--color-companies); }
.cat-concepts .card-category { color: var(--color-concepts); }

.card-name {
  font-size: 1.15rem;
  font-weight: 700;
  color: var(--text-bright);
  margin-bottom: 2px;
  line-height: 1.3;
}

.card-name-en {
  font-size: 0.78rem;
  color: var(--text-dim);
  font-weight: 400;
  margin-bottom: 8px;
}

.card-tagline {
  font-size: 0.85rem;
  color: var(--text);
  font-weight: 500;
  margin-bottom: 8px;
  line-height: 1.4;
  font-style: italic;
}

.card-summary {
  font-size: 0.82rem;
  color: var(--text-dim);
  line-height: 1.5;
  flex: 1;
}

.card-lessons {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 10px;
}

.lesson-badge {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 100px;
  background: rgba(255,255,255,0.06);
  color: var(--text-dim);
}

.cat-people .lesson-badge { color: var(--color-people); }
.cat-companies .lesson-badge { color: var(--color-companies); }
.cat-concepts .lesson-badge { color: var(--color-concepts); }

.flip-hint {
  position: absolute;
  bottom: 8px;
  right: 12px;
  font-size: 0.68rem;
  color: var(--text-dim);
  opacity: 0.5;
}

/* ===== Card Content - Back ===== */
.card-back-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.card-back .card-name {
  font-size: 1.05rem;
  margin-bottom: 0;
}

.back-close-hint {
  font-size: 0.7rem;
  color: var(--text-dim);
  opacity: 0.6;
}

.card-back .card-summary {
  font-size: 0.82rem;
  margin-bottom: 10px;
}

.card-detail-section {
  margin-bottom: 10px;
}

.card-detail-section:last-child { margin-bottom: 0; }

.card-detail-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-dim);
  margin-bottom: 3px;
}

.card-detail-value {
  font-size: 0.82rem;
  color: var(--text);
  line-height: 1.5;
}

/* Obsession & Cost highlights */
.obsession-block {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border-left: 3px solid var(--color-people);
  background: var(--color-people-bg);
}

.obsession-block .obsession-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--color-people);
  margin-bottom: 2px;
}

.obsession-block .obsession-text {
  font-size: 0.85rem;
  color: var(--text-bright);
  font-weight: 600;
  line-height: 1.4;
}

.cost-block {
  margin-top: 6px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border-left: 3px solid #ff6b6b;
  background: rgba(255, 107, 107, 0.08);
}

.cost-block .cost-label {
  font-size: 0.7rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #ff6b6b;
  margin-bottom: 2px;
}

.cost-block .cost-text {
  font-size: 0.85rem;
  color: #ffaaaa;
  font-weight: 500;
  line-height: 1.4;
}

/* ===== Concept card specific ===== */
.concept-explanation {
  font-size: 0.85rem;
  color: var(--text);
  padding: 8px 10px;
  background: rgba(74, 222, 128, 0.06);
  border-radius: var(--radius-sm);
  margin-top: 6px;
  line-height: 1.5;
}

.concept-explanation .explanation-icon {
  color: var(--color-concepts);
  margin-right: 4px;
}

/* ===== Empty state ===== */
.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}

.empty-state .empty-icon {
  font-size: 3rem;
  margin-bottom: 12px;
  opacity: 0.4;
}

.empty-state p {
  font-size: 1rem;
}

/* ===== Animations ===== */
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}

.flip-card {
  animation: fadeInUp 0.45s cubic-bezier(0.4, 0, 0.2, 1) both;
}

.flip-card:nth-child(1) { animation-delay: 0.02s; }
.flip-card:nth-child(2) { animation-delay: 0.04s; }
.flip-card:nth-child(3) { animation-delay: 0.06s; }
.flip-card:nth-child(4) { animation-delay: 0.08s; }
.flip-card:nth-child(5) { animation-delay: 0.10s; }
.flip-card:nth-child(6) { animation-delay: 0.12s; }
.flip-card:nth-child(7) { animation-delay: 0.14s; }
.flip-card:nth-child(8) { animation-delay: 0.16s; }
.flip-card:nth-child(n+9) { animation-delay: 0.18s; }

/* ===== Scrollbar ===== */
.flip-card-front::-webkit-scrollbar,
.flip-card-back::-webkit-scrollbar {
  width: 4px;
}

.flip-card-front::-webkit-scrollbar-track,
.flip-card-back::-webkit-scrollbar-track {
  background: transparent;
}

.flip-card-front::-webkit-scrollbar-thumb,
.flip-card-back::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 4px;
}

/* ===== Footer ===== */
.footer {
  text-align: center;
  padding: 32px 0 8px;
  font-size: 0.78rem;
  color: var(--text-dim);
  opacity: 0.5;
}


/* upgrade5 移动端触控优化 */
@media (max-width:600px){
  body>nav{padding:9px 12px;}
  body>nav a{font-size:0.85rem;padding:7px 2px;}
  button{min-height:34px;}
  .btn.small{min-height:32px;}
  .close-btn{min-height:32px;}
}

</style>

// ===== STATE =====
let activeTab = 'people';
let activeLesson = 'all';
let searchQuery = '';

// ===== RENDER FILTERS =====
function renderFilters() {
  const filterContainer = document.getElementById('filters');
  let maxLesson = 12;
  if (activeTab === 'people') {
    maxLesson = 12;
  } else if (activeTab === 'companies') {
    maxLesson = 11;
  } else {
    maxLesson = 12;
  }

  let html = '<button class="filter-chip active" data-lesson="all">全部</button>';
  for (let i = 1; i <= maxLesson; i++) {
    html += `<button class="filter-chip" data-lesson="${i}">第${i}课</button>`;
  }
  filterContainer.innerHTML = html;

  updateFilterActiveState();

  filterContainer.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeLesson = chip.dataset.lesson === 'all' ? 'all' : parseInt(chip.dataset.lesson);
      filterContainer.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      renderCards();
    });
  });
}

function updateFilterActiveState() {
  const filterContainer = document.getElementById('filters');
  filterContainer.querySelectorAll('.filter-chip').forEach(chip => {
    chip.classList.remove('active');
    if (chip.dataset.lesson === 'all' && activeLesson === 'all') {
      chip.classList.add('active');
    } else if (parseInt(chip.dataset.lesson) === activeLesson) {
      chip.classList.add('active');
    }
  });
}

// ===== FILTER DATA =====
function getFilteredData() {
  let data;
  if (activeTab === 'people') data = PEOPLE;
  else if (activeTab === 'companies') data = COMPANIES;
  else data = CONCEPTS;

  if (activeLesson !== 'all') {
    data = data.filter(item => {
      if (Array.isArray(item.lessons)) {
        return item.lessons.includes(activeLesson);
      }
      return item.lesson === activeLesson;
    });
  }

  if (searchQuery.trim()) {
    const q = searchQuery.trim().toLowerCase();
    data = data.filter(item => {
      const fields = [item.name, item.nameEn || '', item.tagline || '', item.summary || '', item.country || '', item.founders || '', item.explain || ''];
      return fields.some(f => f.toLowerCase().includes(q));
    });
  }

  return data;
}

// ===== RENDER CARDS =====
function renderCards() {
  const grid = document.getElementById('cardGrid');
  const stats = document.getElementById('stats');
  const data = getFilteredData();

  if (data.length === 0) {
    const label = activeTab === 'people' ? '位人物' : activeTab === 'companies' ? '家公司' : '个概念';
    stats.textContent = '没有找到匹配的结果';
  } else {
    const label = activeTab === 'people' ? '位人物' : activeTab === 'companies' ? '家公司' : '个概念';
    stats.textContent = `共 ${data.length} ${label}`;
  }

  const container = document.querySelector('.container');
  container.className = 'container';
  container.classList.add('tab-' + activeTab);

  if (data.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><p>没有找到匹配的结果</p></div>';
    return;
  }

  grid.innerHTML = data.map((item, index) => {
    if (activeTab === 'people') return renderPeopleCard(item);
    if (activeTab === 'companies') return renderCompanyCard(item);
    return renderConceptCard(item);
  }).join('');

  grid.querySelectorAll('.flip-card').forEach(card => {
    card.addEventListener('click', () => {
      card.classList.toggle('flipped');
    });
  });
}

function lessonBadges(lessons) {
  if (!lessons || lessons.length === 0) return '';
  if (Array.isArray(lessons)) {
    return lessons.map(l => `<span class="lesson-badge">第${l}课</span>`).join('');
  }
  return `<span class="lesson-badge">第${lessons}课</span>`;
}

  return `<div class="flip-card cat-people" data-id="${p.id}">

        <div class="card-category">👤 人物</div>

// ===== EVENT HANDLERS =====
function switchTab(tab) {
  activeTab = tab;
  activeLesson = 'all';
  searchQuery = '';
  document.getElementById('searchInput').value = '';

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });

  const container = document.querySelector('.container');
  container.className = 'container';
  container.classList.add('tab-' + tab);

  renderFilters();
  renderCards();
}

// ===== INIT =====
function init() {
  document.getElementById('tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.tab-btn');
    if (!btn) return;
    switchTab(btn.dataset.tab);
  });

  document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderCards();
  });

  renderFilters();
  renderCards();
}

document.addEventListener('DOMContentLoaded', init);
</script>
